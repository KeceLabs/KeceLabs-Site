# KeceLabs — Netlify configuration
# Static site: no build step. Netlify publishes the project root as-is.

[build]
  publish = "."
  command = ""

# Netlify Forms: the contact form in index.html is detected automatically at deploy
# time via its `data-netlify="true"` attribute. Make sure "Form detection" is enabled
# in Site configuration → Forms (it is on by default for new sites).

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# CSS and JS use Netlify's default caching (always revalidated), so visitors get
# updated styles immediately after each deploy. The ?v= query on each <link>/<script>
# also forces a fresh copy; bump it when you change styles.css or script.js.

[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Friendly URLs (Netlify also serves /privacy for privacy.html automatically).
[[redirects]]
  from = "/privacy-policy"
  to = "/privacy.html"
  status = 301

[[redirects]]
  from = "/terms-of-service"
  to = "/terms.html"
  status = 301
